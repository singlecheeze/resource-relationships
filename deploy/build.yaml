# Optional: binary build from the included, compiled dist/ directory.
# Apply in the resource-relationships namespace.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: resource-relationships
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: resource-relationships
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.prebuilt
  output:
    to:
      kind: ImageStreamTag
      name: resource-relationships:v0.5.11
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
