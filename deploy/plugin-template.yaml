apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: resource-relationships
parameters:
  - name: IMAGE
    required: true
    description: Full plugin container image reference
  - name: NAMESPACE
    value: resource-relationships
objects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: resource-relationships
      namespace: ${NAMESPACE}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: resource-relationships-nginx
      namespace: ${NAMESPACE}
    data:
      nginx.conf: |
        worker_processes auto;
        pid /tmp/nginx.pid;
        error_log /dev/stderr;
        events { worker_connections 1024; }
        http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;
          access_log /dev/stdout;
          client_body_temp_path /tmp/client_body;
          proxy_temp_path /tmp/proxy;
          fastcgi_temp_path /tmp/fastcgi;
          uwsgi_temp_path /tmp/uwsgi;
          scgi_temp_path /tmp/scgi;
          server {
            listen 9443 ssl;
            ssl_certificate /var/cert/tls.crt;
            ssl_certificate_key /var/cert/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            location / { try_files $uri =404; }
          }
        }
  - apiVersion: v1
    kind: Service
    metadata:
      name: resource-relationships
      namespace: ${NAMESPACE}
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: resource-relationships-tls
    spec:
      selector:
        app: resource-relationships
      ports:
        - name: https
          port: 9443
          targetPort: https
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: resource-relationships
      namespace: ${NAMESPACE}
    spec:
      replicas: 1
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app: resource-relationships
      template:
        metadata:
          labels:
            app: resource-relationships
        spec:
          serviceAccountName: resource-relationships
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: plugin
              image: ${IMAGE}
              imagePullPolicy: IfNotPresent
              ports:
                - name: https
                  containerPort: 9443
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              readinessProbe:
                httpGet:
                  path: /plugin-manifest.json
                  port: https
                  scheme: HTTPS
                initialDelaySeconds: 3
              livenessProbe:
                httpGet:
                  path: /plugin-manifest.json
                  port: https
                  scheme: HTTPS
                initialDelaySeconds: 15
              volumeMounts:
                - name: config
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
                  readOnly: true
                - name: tls
                  mountPath: /var/cert
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: resource-relationships-nginx
            - name: tls
              secret:
                secretName: resource-relationships-tls
            - name: tmp
              emptyDir: {}
  - apiVersion: console.openshift.io/v1
    kind: ConsolePlugin
    metadata:
      name: resource-relationships
    spec:
      displayName: Resource Relationships
      backend:
        type: Service
        service:
          name: resource-relationships
          namespace: ${NAMESPACE}
          port: 9443
          basePath: /
